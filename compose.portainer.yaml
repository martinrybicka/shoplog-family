name: shoplog-family

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: shoplog-family-db:${SHOPLOG_DB_IMAGE_TAG:-${SHOPLOG_IMAGE_TAG:-latest}}
    pull_policy: never
    environment:
      POSTGRES_DB: shoplog
      POSTGRES_USER: shoplog_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Nastavte samostatne nahodne heslo spravce DB}
      SHOPLOG_APP_DB_USER: shoplog
      SHOPLOG_APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte nahodne heslo aplikacni DB role}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U shoplog_bootstrap -d shoplog']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  backend:
    image: shoplog-family-backend:${SHOPLOG_APP_IMAGE_TAG:-1.1.0}
    pull_policy: never
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Nastavte nahodny Django secret}
      DJANGO_ALLOWED_HOSTS: ${SHOPLOG_DOMAIN:?Nastavte verejnou domenu},localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SHOPLOG_DOMAIN}
      DJANGO_HSTS_SECONDS: "0"
      SHOPLOG_SETUP_TOKEN: ${SHOPLOG_SETUP_TOKEN:-}
      POSTGRES_DB: shoplog
      POSTGRES_USER: shoplog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777,size=268435456
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    init: true
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped

  web:
    image: shoplog-family-web:${SHOPLOG_APP_IMAGE_TAG:-1.1.0}
    pull_policy: never
    environment:
      PUBLIC_SCHEME: https
    ports:
      - ${SHOPLOG_BIND_ADDRESS:-0.0.0.0}:${SHOPLOG_HTTP_PORT:-8090}:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  application:
  database:
    internal: true
