# Příprava pro HTTPS reverzní proxy; použití až po samostatném schválení nasazení.
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_ALLOWED_HOSTS: ${SHOPLOG_DOMAIN:?Nastavte doménu},localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SHOPLOG_DOMAIN}
  web:
    environment:
      PUBLIC_SCHEME: https
